<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeroTouch - Camera Setup</title>
  <style>
    :root {
      --bg: #080c14;
      --card: rgba(15, 23, 42, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --btn-bg: #f8fafc;
      --btn-color: #0f172a;
      --success-bg: rgba(16, 185, 129, 0.12);
      --success-border: rgba(16, 185, 129, 0.35);
      --success-text: #34d399;
      --error-bg: rgba(239, 68, 68, 0.12);
      --error-border: rgba(239, 68, 68, 0.35);
      --error-text: #f87171;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: 18px;
      padding: 40px 36px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .icon-box {
      width: 58px;
      height: 58px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-box svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: #f8fafc;
      stroke-width: 2;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #f8fafc;
      letter-spacing: -0.3px;
    }
    p {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
    }
    .btn {
      width: 100%;
      padding: 13px 24px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-primary {
      background: var(--btn-bg);
      color: var(--btn-color);
    }
    .btn-primary:hover {
      background: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(255, 255, 255, 0.15);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .status-msg {
      font-size: 13px;
      padding: 12px 16px;
      border-radius: 10px;
      width: 100%;
      display: none;
      line-height: 1.5;
      text-align: left;
    }
    .status-success {
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
    }
    .status-error {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
    }
    .camera-preview {
      width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: none;
      max-height: 180px;
      object-fit: cover;
      transform: scaleX(-1);
    }
    .privacy-notice {
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">
      <svg viewBox="0 0 24 24">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
        <circle cx="12" cy="13" r="4"></circle>
      </svg>
    </div>

    <div>
      <h1>Webcam Access</h1>
      <p style="margin-top: 6px;">AeroTouch requires camera access for local gesture detection. Your video never leaves your device.</p>
    </div>

    <video id="preview-video" class="camera-preview" autoplay playsinline muted></video>

    <div id="status-box" class="status-msg"></div>

    <button id="btn-request" class="btn btn-primary">
      Allow Camera Access
    </button>

    <span class="privacy-notice">Processing runs entirely on-device via WebAssembly.</span>
  </div>

  <script src="permission.js"></script>
</body>
</html>
